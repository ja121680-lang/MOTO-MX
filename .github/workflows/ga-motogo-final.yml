name: GA MotoGo Final QA

on:
  push:
    branches:
      - ga/motogo-final-ga-20260927
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: motogo_mx_starter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ga/motogo-final-ga-20260927
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; skipping Flutter tests."
          fi
      - name: Ensure Android platform scaffold
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --platforms=android --project-name=motogo_mx --org=com.gaeasy
          fi
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: ga-motogo-final-apk
          path: motogo_mx_starter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Persist formatting after successful QA
        working-directory: .
        run: |
          if [ -z "$(git status --porcelain -- motogo_mx_starter/lib motogo_mx_starter/pubspec.lock)" ]; then
            echo "No formatting or lockfile changes to persist."
            exit 0
          fi
          git config user.name "GA MotoGo QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add motogo_mx_starter/lib motogo_mx_starter/pubspec.lock
          git commit -m "build: persist MotoGo formatting and dependency lock"
          git push origin HEAD:ga/motogo-final-ga-20260927
