name: GA Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: motogo_mx_starter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; skipping Flutter tests."
          fi
      - name: Ensure Android platform scaffold
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Android scaffold is not committed; generating a temporary CI scaffold."
            flutter create . --platforms=android --project-name=motogo_mx_starter --org=com.gaeasy
          fi
      - name: Configure Android voice permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android.permission.RECORD_AUDIO' not in text:
              block = '''    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          '''
              text = text.replace('    <application', block + '    <application', 1)
              path.write_text(text)
          PY
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: motogo-mx-release-apk
          path: motogo_mx_starter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
