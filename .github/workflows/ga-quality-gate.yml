name: GA Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: motogo_mx_starter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; skipping Flutter tests."
          fi
      - name: Ensure Android platform scaffold
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Android scaffold is not committed; generating a temporary CI scaffold."
            flutter create . --platforms=android --project-name=motogo_mx_starter --org=com.gaeasy
          fi
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: motogo-mx-release-apk
          path: motogo_mx_starter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
