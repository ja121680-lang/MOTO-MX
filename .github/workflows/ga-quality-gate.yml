name: GA Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: motogo_mx_starter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet; skipping Flutter tests."
          fi
      - name: Build web
        run: flutter build web --release
